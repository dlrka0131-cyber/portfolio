<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="50%" stop-color="#F3E8FF"/>
      <stop offset="100%" stop-color="#E9D5FF"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#805AD5" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="32" fill="url(#bg4)"/>

  <!-- Portal Galaxy / Magic Stars -->
  <circle cx="120" cy="140" r="30" fill="#D6BCFA" opacity="0.6"/>
  <path d="M820 100 L830 130 L860 140 L830 150 L820 180 L810 150 L780 140 L810 130 Z" fill="#FAF089"/>

  <!-- Main Illustration Group -->
  <g transform="translate(480, 210)" filter="url(#shadow4)">
    <!-- Magic Portal Vortex in Center -->
    <ellipse cx="0" cy="80" rx="90" ry="40" fill="#4C1D95" stroke="#9F7AEA" stroke-width="6"/>
    <ellipse cx="0" cy="80" rx="60" ry="25" fill="#6B21A8" stroke="#E9D5FF" stroke-width="4"/>
    <ellipse cx="0" cy="80" rx="30" ry="12" fill="#A855F7"/>

    <!-- Pinkbean Body Floating with Wand -->
    <path d="M-90 10 C-90 -80, 90 -80, 90 10 C100 80, -100 80, -90 10 Z" fill="#FFB6C1" stroke="#FF69B4" stroke-width="7"/>
    <!-- Magic Wand -->
    <line x1="-30" y1="20" x2="-80" y2="-20" stroke="#805AD5" stroke-width="6" stroke-linecap="round"/>
    <path d="M-80 -20 L-75 -35 L-90 -30 L-85 -10 Z" fill="#ECC94B"/>
    <!-- Eyes -->
    <ellipse cx="-20" cy="-20" rx="8" ry="12" fill="#2D3748"/>
    <ellipse cx="30" cy="-20" rx="8" ry="12" fill="#2D3748"/>
  </g>

  <!-- Main Title Banner -->
  <g transform="translate(480, 390)">
    <text x="0" y="0" text-anchor="middle" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-weight="900" font-size="44" fill="#6B46C1" letter-spacing="-1">
      공간 이동 포털 마법 배우기
    </text>
  </g>

  <!-- Subtitle Pill Capsule -->
  <g transform="translate(480, 455)">
    <rect x="-240" y="-24" width="480" height="48" rx="24" fill="#FFFFFF" stroke="#805AD5" stroke-width="3" filter="url(#shadow4)"/>
    <text x="0" y="7" text-anchor="middle" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-weight="800" font-size="19" fill="#553C9A">
      [4차시] '신호 보내기'를 활용한 위치 이동 로직 구현하기
    </text>
  </g>

  <text x="480" y="505" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="14" fill="#A0AEC0">
    HelloMaple Creation Class
  </text>
</svg>
