<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBFBEE"/>
      <stop offset="50%" stop-color="#F0FFF4"/>
      <stop offset="100%" stop-color="#E6FFFA"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38A169" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="32" fill="url(#bg2)"/>

  <!-- Construction / Map Doodles -->
  <path d="M100 120 L150 100 L200 130 L160 160 Z" fill="#C6F6D5" stroke="#38A169" stroke-width="4"/>
  <circle cx="850" cy="120" r="28" fill="#FEFCBF" stroke="#D69E2E" stroke-width="4"/>

  <!-- Main Illustration Group -->
  <g transform="translate(480, 220)" filter="url(#shadow2)">
    <!-- White Giant Character with Yellow Hardhat -->
    <path d="M-80 -80 C-80 -140, 80 -140, 80 -80 C100 20, 90 60, 70 80 C0 100, -70 80, -80 -80 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="6"/>
    <!-- Yellow Builder Helmet -->
    <path d="M-20 -130 Q40 -160 90 -110 Q110 -90 40 -80 Z" fill="#ECC94B" stroke="#D69E2E" stroke-width="5"/>
    <!-- Pinkbean Body with Blueprint -->
    <path d="M-90 40 C-90 -50, 90 -50, 90 40 C100 110, -100 110, -90 40 Z" fill="#FFB6C1" stroke="#FF69B4" stroke-width="7"/>
    <!-- Blueprint paper in hand -->
    <rect x="-40" y="20" width="70" height="50" rx="6" fill="#3182CE" stroke="#1A365D" stroke-width="4"/>
    <line x1="-30" y1="35" x2="10" y2="35" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="-30" y1="50" x2="-10" y2="50" stroke="#FFFFFF" stroke-width="3"/>
    <!-- Eyes -->
    <ellipse cx="-30" cy="10" rx="8" ry="12" fill="#2D3748"/>
    <path d="M20 10 Q35 0 40 15" stroke="#2D3748" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Main Title Banner -->
  <g transform="translate(480, 390)">
    <text x="0" y="0" text-anchor="middle" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-weight="900" font-size="44" fill="#319795" letter-spacing="-1">
      화면구성 &amp; 맵꾸미기
    </text>
  </g>

  <!-- Subtitle Pill Capsule -->
  <g transform="translate(480, 455)">
    <rect x="-195" y="-24" width="390" height="48" rx="24" fill="#FFFFFF" stroke="#319795" stroke-width="3" filter="url(#shadow2)"/>
    <text x="0" y="7" text-anchor="middle" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-weight="800" font-size="20" fill="#2C7A7B">
      [2차시] 내 맘대로 만드는 메이플 월드
    </text>
  </g>

  <text x="480" y="505" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="14" fill="#A0AEC0">
    HelloMaple Creation Class
  </text>
</svg>
