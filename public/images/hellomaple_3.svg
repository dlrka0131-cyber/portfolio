<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F5"/>
      <stop offset="50%" stop-color="#FFFAF0"/>
      <stop offset="100%" stop-color="#FFFFF0"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#DD6B20" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="32" fill="url(#bg3)"/>

  <!-- Food / Fork / Spoon Doodles -->
  <path d="M120 120 L130 180 M130 120 L130 180 M140 120 L130 180" stroke="#DD6B20" stroke-width="4" stroke-linecap="round"/>
  <circle cx="840" cy="140" r="22" fill="#FBD38D" stroke="#DD6B20" stroke-width="4"/>

  <!-- Main Illustration Group -->
  <g transform="translate(480, 220)" filter="url(#shadow3)">
    <path d="M-80 -80 C-80 -140, 80 -140, 80 -80 C100 20, 90 60, 70 80 C0 100, -70 80, -80 -80 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="6"/>
    <!-- Mustache on White Character -->
    <path d="M-20 -90 Q0 -105 20 -90 Q0 -75 -20 -90 Z" fill="#4A5568"/>
    <!-- Pinkbean with Fork & Knife -->
    <path d="M-90 40 C-90 -50, 90 -50, 90 40 C100 110, -100 110, -90 40 Z" fill="#FFB6C1" stroke="#FF69B4" stroke-width="7"/>
    <!-- Fork -->
    <path d="M-60 10 L-60 50 M-70 10 L-70 30 M-50 10 L-50 30" stroke="#718096" stroke-width="4" stroke-linecap="round"/>
    <!-- Knife -->
    <path d="M60 10 L60 50 Q75 30 60 10 Z" fill="#CBD5E0" stroke="#718096" stroke-width="3"/>
    <!-- Cheeks & Yummy Face -->
    <path d="M-10 20 Q5 35 20 20 Z" fill="#E53E3E"/>
  </g>

  <!-- Main Title Banner -->
  <g transform="translate(480, 390)">
    <text x="0" y="0" text-anchor="middle" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-weight="900" font-size="44" fill="#DD6B20" letter-spacing="-1">
      오브젝트 상호작용 익히기
    </text>
  </g>

  <!-- Subtitle Pill Capsule -->
  <g transform="translate(480, 455)">
    <rect x="-210" y="-24" width="420" height="48" rx="24" fill="#FFFFFF" stroke="#DD6B20" stroke-width="3" filter="url(#shadow3)"/>
    <text x="0" y="7" text-anchor="middle" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-weight="800" font-size="20" fill="#C05621">
      [3차시] 아바타와 음식의 상호작용 구현하기
    </text>
  </g>

  <text x="480" y="505" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="14" fill="#A0AEC0">
    HelloMaple Creation Class
  </text>
</svg>
